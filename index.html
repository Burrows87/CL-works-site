<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="CL Works è temporaneamente in aggiornamento.">
  <title>CL Works — Sito in aggiornamento</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f0e8;
      --ink: #33291f;
      --muted: #76695b;
      --line: #ded3c4;
      --accent: #806044;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.48);
      text-align: center;
      box-shadow: 0 18px 60px rgba(65,45,25,.06);
    }
    .brand {
      margin: 0 0 42px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .mark {
      width: 42px;
      height: 2px;
      margin: 0 auto 28px;
      background: var(--accent);
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 7vw, 52px);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.08;
    }
    p {
      max-width: 410px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }
    .foot {
      margin-top: 44px;
      color: #948575;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">CL Works</p>
    <div class="mark" aria-hidden="true"></div>
    <h1>Stiamo preparando qualcosa di nuovo.</h1>
    <p>Il sito CL Works è temporaneamente in aggiornamento. Torneremo online con una nuova veste.</p>
    <p class="foot">Grazie per la pazienza</p>
  </main>
</body>
</html>
